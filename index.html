<style>
  :root {

  button.chip {

    font: inherit; font-weight: 650; cursor: pointer;

  .ghost { background: rgba(148,163,184,.12); color: var(--text); }

, "m": "v. 推测", "e": "It is too early to speculate about outcomes."}, {"w": "stipulate", "p": "ˈstɪpjuleɪt", "m": "v. 规定", "e": "The contract stipulates clear deadlines."}, {"w": "suppress", "p": "səˈpres", "m": "v. 压制；抑制", "e": "Authorities tried to suppress the report."}, {"w": "underpin", "p": "ˌʌndəˈpɪn", "m": "v. 支撑；构成基础", "e": "Trust underpins effective collaboration."}, {"w": "juxtapose", "p": "ˌdʒʌkstəˈpəʊz", "m": "v. 并置对照", "e": "The essay juxtaposes two competing theories."}, {"w": "tenacious", "p": "təˈneɪʃəs", "m": "adj. 顽强的", "e": "She remained tenacious despite repeated setbacks."}];
const KEY = 'dailyEnglish.learned.v1';

function nowHK(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function dayIndex(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/86400000);
}
function wordsForDate(iso){
  const base = (dayIndex(iso) * 2) % WORDS.length;
  return [WORDS[base], WORDS[(base + 1) % WORDS.length]];
}
function loadLearned(){
  try { return JSON.parse(localStorage.getItem(KEY) || '{"items":[]}'); }
  catch { return {items:[]}; }
}
function saveLearned(data){ localStorage.setItem(KEY, JSON.stringify(data)); }
function isLearned(word){
  return loadLearned().items.some(x => x.w === word);
}
function markLearned(item, date){
  const data = loadLearned();
  if (!data.items.some(x => x.w === item.w)) {
    data.items.unshift({ w:item.w, p:item.p, m:item.m, e:item.e, date, at: Date.now() });
    saveLearned(data);
  }
  refresh();
}
function weekBounds(iso){
  // count learned with date in last 7 HK days including today
  const [y,m,d] = iso.split('-').map(Number);
  const today = Date.UTC(y,m-1,d);
  const set = new Set();
  for (let i=0;i<7;i++){
    const t = new Date(today - i*86400000);
    const s = t.toISOString().slice(0,10);
    set.add(s);
  }
  return set;
}
function speak(item){
  const u = new SpeechSynthesisUtterance(item.w + '. ' + item.e);
  u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
async function copyItem(item, btn){
  const text = `${item.w} /${item.p}/\n${item.m}\n${item.e}`;
  await navigator.clipboard.writeText(text);
  const old = btn.textContent; btn.textContent = '已复制'; setTimeout(()=>btn.textContent=old,1000);
}
function renderCard(el, item, label, date){
  const learned = isLearned(item.w);
  el.innerHTML = `
    <div class="row">
      <div class="tag">${label}</div>
      ${learned ? '<span class="badge">已学</span>' : ''}
    </div>
    <h2 class="word">${item.w}</h2>
    <p class="phonetic">/${item.p}/</p>
    <p class="meaning">${item.m}</p>
    <p class="example">${item.e}</p>
    <div class="actions">
      <button class="chip primary" type="button" data-speak>朗读</button>
      <button class="chip ghost" type="button" data-copy>复制</button>
      <button class="chip ${learned ? 'ok' : 'ghost'}" type="button" data-learn>${learned ? '已标记' : '标记已学'}</button>
    </div>`;
  el.querySelector('[data-speak]').onclick = () => speak(item);
  el.querySelector('[data-copy]').onclick = (e) => copyItem(item, e.currentTarget);
  el.querySelector('[data-learn]').onclick = () => markLearned(item, date);
}
function addDaysISO(iso, delta){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y,m-1,d) + delta*86400000);
  return t.toISOString().slice(0,10);
}
function refresh(){
  const iso = nowHK();
  document.getElementById('date').textContent = iso + ' · HKT';
  const [a,b] = wordsForDate(iso);
  renderCard(document.getElementById('card1'), a, 'Word 1', iso);
  renderCard(document.getElementById('card2'), b, 'Word 2', iso);

  const learned = loadLearned().items;
  document.getElementById('totalCount').textContent = String(learned.length);
  const week = weekBounds(iso);
  document.getElementById('weekCount').textContent = String(learned.filter(x => week.has(x.date)).length);

  const cal = document.getElementById('calendarHist');
  cal.innerHTML = '';
  for (let i=0;i<14;i++){
    const day = addDaysISO(iso, -i);
    const pair = wordsForDate(day);
    const box = document.createElement('div');
    box.className = 'hist-item';
    box.innerHTML = `
      <div class="top"><div class="d">${day}${i===0?' · 今天':''}</div></div>
      <div class="w">${pair[0].w} · ${pair[1].w}</div>
      <div class="m">${pair[0].m} ｜ ${pair[1].m}</div>`;
    cal.appendChild(box);
  }

  const lh = document.getElementById('learnedHist');
  lh.innerHTML = '';
  if (!learned.length) {
    lh.innerHTML = '<div class="empty">还没有标记。回到「今天」点「标记已学」。</div>';
  } else {
    learned.slice(0,80).forEach(item => {
      const box = document.createElement('div');
      box.className = 'hist-item';
      box.innerHTML = `
        <div class="top"><div class="w">${item.w}</div><div class="d">${item.date || ''}</div></div>
        <div class="m">${item.m}</div>`;
      lh.appendChild(box);
    });
  }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b===btn));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + btn.dataset.tab));
  };
});
document.getElementById('clearLearned').onclick = () => {
  if (confirm('清空本机「已学」标记？')) { saveLearned({items:[]}); refresh(); }
};
refresh();
</script>
