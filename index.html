, "m": "v. 推测", "e": "It is too early to speculate about outcomes."}, {"w": "stipulate", "p": "ˈstɪpjuleɪt", "m": "v. 规定", "e": "The contract stipulates clear deadlines."}, {"w": "suppress", "p": "səˈpres", "m": "v. 压制；抑制", "e": "Authorities tried to suppress the report."}, {"w": "underpin", "p": "ˌʌndəˈpɪn", "m": "v. 支撑；构成基础", "e": "Trust underpins effective collaboration."}, {"w": "juxtapose", "p": "ˌdʒʌkstəˈpəʊz", "m": "v. 并置对照", "e": "The essay juxtaposes two competing theories."}, {"w": "tenacious", "p": "təˈneɪʃəs", "m": "adj. 顽强的", "e": "She remained tenacious despite repeated setbacks."}];
function nowHK(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function dayIndex(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/86400000);
}
function render(el, item, label){
  el.innerHTML = `
    <div class="tag">${label}</div>
    <h1>${item.w}</h1>
    <p class="phonetic">/${item.p}/</p>
    <p class="meaning">${item.m}</p>
    <p class="example">${item.e}</p>
    <div class="actions">
      <button class="primary" type="button" data-speak>朗读</button>
      <button class="ghost" type="button" data-copy>复制</button>
    </div>`;
  el.querySelector('[data-speak]').onclick = () => {
    const u = new SpeechSynthesisUtterance(item.w + '. ' + item.e);
    u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  el.querySelector('[data-copy]').onclick = async (ev) => {
    const text = `${item.w} /${item.p}/\n${item.m}\n${item.e}`;
    await navigator.clipboard.writeText(text);
    const b = ev.currentTarget; b.textContent = '已复制'; setTimeout(()=>b.textContent='复制',1200);
  };
}
const iso = nowHK();
const base = (dayIndex(iso) * 2) % WORDS.length;
const a = WORDS[base];
const b = WORDS[(base + 1) % WORDS.length];
document.getElementById('date').textContent = iso + ' · HKT';
render(document.getElementById('card1'), a, 'Word 1');
render(document.getElementById('card2'), b, 'Word 2');
