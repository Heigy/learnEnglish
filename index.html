function nowHK(){
  const s = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return s; // YYYY-MM-DD
}
function dayIndex(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const start = Date.UTC(y,0,0);
  const now = Date.UTC(y,m-1,d);
  return Math.floor((now-start)/86400000);
}
function pick(iso){
  const i = dayIndex(iso) % WORDS.length;
  return WORDS[i];
}
const iso = nowHK();
const item = pick(iso);
document.getElementById('date').textContent = iso + ' · Asia/Hong_Kong';
document.getElementById('word').textContent = item.w;
document.getElementById('phonetic').textContent = '/' + item.p + '/';
document.getElementById('meaning').textContent = item.m;
document.getElementById('example').textContent = item.e;
document.getElementById('speak').onclick = () => {
  const u = new SpeechSynthesisUtterance(item.w + '. ' + item.e);
  u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u);
};
document.getElementById('copy').onclick = async () => {
  const text = `${item.w} /${item.p}/\n${item.m}\n${item.e}`;
